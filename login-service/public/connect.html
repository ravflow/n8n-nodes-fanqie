<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>连接番茄作者账号</title>
		<link rel="stylesheet" href="/assets/style.css" />
	</head>
	<body>
		<main class="card">
			<div class="brand">番茄作者 · n8n</div>
			<h1>扫码连接作者账号</h1>
			<p class="intro">
				打开手机上的<strong>番茄小说</strong>或<strong>番茄作家助手</strong>，扫描下方二维码并确认登录。
			</p>
			<div class="qr-box">
				<img id="qr" alt="番茄官方登录二维码" hidden />
				<div id="qr-placeholder">正在准备官方二维码…</div>
			</div>
			<p id="status" class="status" role="status" aria-live="polite">正在打开官方登录页…</p>
			<div class="actions">
				<button id="refresh" type="button" hidden>刷新二维码</button
				><button id="retry" type="button" hidden>重试连接检查</button
				><button id="cancel" class="secondary" type="button">取消连接</button>
			</div>
			<p class="note">
				此页面由你的 n8n 管理员部署。二维码来自番茄官方登录页；登录态会加密保存在此组件中，供 n8n
				调用作者接口。扫码后将自动返回 n8n。
			</p>
			<a
				class="official"
				href="https://fanqienovel.com/main/writer/login"
				target="_blank"
				rel="noopener noreferrer"
				>查看番茄官方登录页</a
			>
		</main>
		<script src="/assets/app.js" defer></script>
	</body>
</html>
