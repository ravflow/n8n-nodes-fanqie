services:
  fanqie-login:
    build: .
    container_name: ravflow-fanqie-login
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:8789:8789'
    volumes:
      - ./data:/app/data
    shm_size: 512mb
    mem_limit: 1g
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
