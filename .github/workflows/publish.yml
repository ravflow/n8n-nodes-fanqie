name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@12.2.0

      - name: Validate release tag and choose npm dist-tag
        id: release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const refVersion = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (refVersion !== version) throw new Error('Git tag must match package.json version');
          const prerelease = version.split('-')[1]?.split('.')[0];
          const distTag = prerelease ? (/^[a-z][a-z0-9-]*$/.test(prerelease) ? prerelease : 'next') : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distTag}\n`);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate package
        run: |
          npm run lint
          npm run typecheck
          npm run build
          node --test tests/*.test.cjs

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          RELEASE_MODE: 'true'
          # Bootstrap the first release with this secret, then use npm OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
